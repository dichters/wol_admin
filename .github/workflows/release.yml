name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION} (tag: ${TAG})"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build all platforms
        run: |
          chmod +x bin/sh/build-all.sh
          ./bin/sh/build-all.sh "${{ steps.version.outputs.version }}"

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          gh release create "${TAG}" \
            --title "wol_admin ${VERSION}" \
            --notes "## wol_admin ${VERSION}

          自动构建发布。详见 [README](https://github.com/${{ github.repository }}/blob/master/README.md)。

          ### 下载说明
          - **Linux aarch64**: \`wol_admin-${VERSION}-linux-aarch64.zip\`
          - **Linux x86-64**: \`wol_admin-${VERSION}-linux-x86-64.zip\`
          - **macOS darwin** (Apple Silicon): \`wol_admin-${VERSION}-macos-darwin.zip\`
          - **macOS Intel**: \`wol_admin-${VERSION}-macos-intel.zip\`
          - **Windows x86-64**: \`wol_admin-${VERSION}-windows-x86-64.zip\`
          - **源码包**: \`wol_admin-${VERSION}-source-code.zip\`

          每个二进制压缩包内含：
          - 二进制文件
          - 配置文件样例 (\`config.template.json\`)
          - systemd 服务文件 (\`wol_admin.service\`，仅 Linux/macOS)

          所有产物均使用 \`CGO_ENABLED=0\` 纯静态编译。
          " \
            release/*

          echo "Release ${TAG} created successfully!"
